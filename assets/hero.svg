<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Erywim — AI Full-Stack Engineer</title>
  <desc id="desc">Hi, I'm Erywim，AI Full-Stack Engineer。横幅包含动态打字效果、扫描线和终端卡片，副标题为 Agent Systems · RAG · LLM Applications。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1B31"/>
      <stop offset="1" stop-color="#09101D"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7DD3FC" stroke-width="0.7" opacity="0.09"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="878" height="238" rx="17"/>
    </clipPath>
    <clipPath id="card">
      <rect x="606" y="48" width="224" height="152" rx="12"/>
    </clipPath>
    <clipPath id="typingClip">
      <rect x="54" y="128" width="0" height="42">
        <animate attributeName="width" values="0;372;372;0" keyTimes="0;0.38;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="878" height="238" rx="17" fill="url(#bg)"/>
  <rect x="1" y="1" width="878" height="238" rx="17" fill="url(#grid)"/>
  <ellipse cx="785" cy="54" rx="245" ry="155" fill="url(#cyanGlow)">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="90" cy="232" rx="260" ry="130" fill="url(#blueGlow)"/>

  <g clip-path="url(#frame)">
    <rect x="-190" y="-100" width="170" height="440" fill="url(#sweep)" opacity="0.48" transform="rotate(17 0 0)">
      <animate attributeName="x" values="-260;1080" dur="8.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="158" cy="44" r="2.2" fill="#67E8F9" opacity="0.6">
      <animate attributeName="cy" values="44;30;44" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="516" cy="194" r="1.8" fill="#38BDF8" opacity="0.5">
      <animate attributeName="cy" values="194;208;194" dur="6.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="6.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="837" cy="182" r="2.4" fill="#A78BFA" opacity="0.55">
      <animate attributeName="cy" values="182;168;182" dur="7.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="7.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="472" cy="52" r="1.5" fill="#FFFFFF" opacity="0.4">
      <animate attributeName="cy" values="52;38;52" dur="6.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="6.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="1" y="1" width="878" height="238" rx="17" fill="none" stroke="#1E3A5F" stroke-width="2"/>

  <text x="54" y="70" fill="#34D399" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.1">&gt; whoami</text>
  <text x="54" y="120" fill="#F8FAFC" font-family="'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">Hi, I'm Erywim</text>

  <g clip-path="url(#typingClip)">
    <text x="54" y="160" fill="#67E8F9" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="600">AI Full-Stack Engineer</text>
    <rect x="406" y="138" width="3" height="28" fill="#67E8F9">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="54" y="196" fill="#94A3B8" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="0.4">Agent Systems · RAG · LLM Applications</text>

  <g>
    <rect x="606" y="48" width="224" height="152" rx="12" fill="#0B1628" fill-opacity="0.94" stroke="#24425F" stroke-width="1.2"/>
    <g clip-path="url(#card)">
      <rect x="606" y="48" width="224" height="2" fill="#22D3EE" opacity="0.55">
        <animate attributeName="y" values="48;198;48" dur="5.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <circle cx="622" cy="66" r="3.2" fill="#FB7185"/>
    <circle cx="634" cy="66" r="3.2" fill="#FBBF24"/>
    <circle cx="646" cy="66" r="3.2" fill="#34D399"/>
    <path d="M606 79H830" stroke="#24425F" stroke-width="1"/>
    <text x="622" y="101" fill="#34D399" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">$ whoami</text>
    <text x="622" y="119" fill="#E2E8F0" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">erywim</text>
    <text x="622" y="139" fill="#34D399" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">$ focus</text>
    <text x="622" y="157" fill="#67E8F9" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">agent · rag · llm</text>
    <text x="622" y="177" fill="#34D399" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">$ status</text>
    <text x="622" y="193" fill="#FBBF24" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">building pi-amadeus_</text>
    <circle cx="807" cy="189" r="2.2" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
